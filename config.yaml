# Single source of truth for paths, seasons, splits, thresholds and seeds.
# Loaded via src/ipl_late_overs/config.py. Paths are relative to the repo root.

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures
  weekly_dir: reports/weekly
  raw_zip: data/raw/ipl_json.zip
  download_manifest: data/raw/download_manifest.json
  matches: data/interim/matches.parquet
  match_players: data/interim/match_players.parquet
  people: data/interim/people.parquet
  deliveries: data/interim/deliveries.parquet
  replacements: data/interim/replacements.parquet
  data_audit: reports/data_audit.md
  late_overs: data/processed/late_overs.parquet
  late_over_bowler_loads: data/processed/late_over_bowler_loads.parquet
  overs_exclusions: data/processed/overs_exclusions.json
  fig_runs_by_over: reports/figures/runs_in_over_by_over.png
  history_bowler: data/processed/history_bowler.parquet
  history_batter: data/processed/history_batter.parquet
  history_league: data/processed/history_league.parquet
  features: data/processed/features.parquet
  features_report: reports/features.md

download:
  url: https://cricsheet.org/downloads/ipl_json.zip
  timeout_seconds: 120

match:
  # Standard IPL match format. Matches with other values are flagged in the audit.
  overs: 20
  balls_per_over: 6
  max_overs_per_bowler: 4

late_overs:
  # Overs 15-20 in cricket numbering = Cricsheet 0-indexed overs 14-19.
  first_over_index: 14
  last_over_index: 19
  wickets_per_innings: 10
  # Wicket entries that are NOT dismissals (the batter may return). "retired out" IS a dismissal.
  non_dismissal_wicket_kinds: ["retired hurt"]
  # Five late overs rebuilt by hand from the raw JSON (tests/test_overs.py) and printed in
  # the audit for checking against ESPNcricinfo. Over = 0-indexed Cricsheet over.
  verification_overs:
    - {match_id: "336040", over: 19}   # 2008 final, RR v CSK
    - {match_id: "734049", over: 19}   # 2014 final, KKR v KXIP
    - {match_id: "1082650", over: 19}  # 2017 final, MI v RPS
    - {match_id: "1181768", over: 19}  # 2019 final, MI v CSK
    - {match_id: "1312200", over: 18}  # 2022 final, RR v GT

# Player and league history (week 3). History for a match uses only matches strictly
# earlier in (date, numeric match_id) order. Shrunk mean = (n*mean + k*league)/(n + k).
history:
  shrinkage_k:
    bowler_late_overs: 10         # pseudo-overs of league-average late-chase overs
    bowler_economy_balls: 120     # pseudo-balls, all phases
    bowler_inn1_late_balls: 60    # pseudo-balls, overs 15-20 of first innings
    batter_balls: 100             # strike rate, all phases
    batter_late_balls: 60         # strike rate, overs 15-20
    batter_dismissal_balls: 200   # dismissals per ball
  min_history:
    bowler_late_overs: 5          # fewer earlier late-chase overs -> bowler_low_history
    batter_balls: 60              # fewer earlier balls faced -> striker_low_history
  # Used only where no earlier match exists at all (the first IPL match): typical T20 values.
  league_prior:
    late_over_runs: 8.5
    economy: 7.5                  # runs conceded per over
    inn1_late_economy: 9.0
    strike_rate: 120.0
    late_strike_rate: 140.0
    dismissals_per_ball: 0.05

features:
  # Optional one-hot of player IDs, fitted on training rows only; rarer IDs -> "unknown".
  id_encoding:
    enabled: false
    roles: [bowler_id, striker_id]
    min_rows: 30
  leakage_check_rows: 300         # random rows recomputed from raw data on every `make features`
  label_correlation_threshold: 0.9

# Season = calendar year of the match's first date (Cricsheet labels such as
# "2007/08" and "2020/21" are normalised this way; see reports/data_audit.md).
# Splits are by whole season, so all overs of a match stay in one split.
splits:
  train_seasons: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021]
  # Expanding-window validation: fold k trains on train_seasons + earlier
  # validation folds and validates on validation_seasons[k].
  validation_seasons: [2022, 2023, 2024]
  # Held out. Only loadable via `evaluate.py --final` (enforced from week 4).
  test_seasons: [2025, 2026]

seed: 20260101
